<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="googleb76021d09e6f22f4.html" />
    <title>谭浏洋 · 电子音乐作曲家 | Liuyang Tan · Composer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f7f7fa;
            --card: #ffffff;
            --text: #1c1c22;
            --muted: #6b6b80;
            --accent: #5b7fff;
            --border: #e8e8ef;
            --radius: 20px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding-top: 72px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: 0.2s;
        }
        a:hover {
            color: #3f5fcf;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(247, 247, 250, 0.78);
            backdrop-filter: blur(14px) saturate(1.2);
            border-bottom: 1px solid rgba(232, 232, 239, 0.5);
            padding: 14px 0;
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .logo:hover {
            color: var(--text);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--accent);
            transition: 0.25s;
        }
        .nav-links a:hover {
            color: var(--text);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text);
            border-radius: 4px;
            transition: 0.25s;
        }

        .section {
            padding: 64px 0 56px;
            border-bottom: 1px solid var(--border);
        }
        .section:last-of-type {
            border-bottom: none;
        }

        /* ===== 简介 ===== */
        #about .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 56px;
            align-items: center;
        }

        .photo {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--card);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .about-content h1 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }
        .about-content .subhead {
            font-size: 1rem;
            color: var(--muted);
            margin-bottom: 18px;
            font-weight: 400;
        }

        .about-content p {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.7;
            margin-bottom: 14px;
        }
        .about-content p:last-child {
            margin-bottom: 0;
        }

        .about-content .divider {
            width: 40px;
            height: 2px;
            background: var(--accent);
            margin: 14px 0 18px;
            border-radius: 4px;
        }

        /* ===== 作品 ===== */
        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 24px;
        }

        .category-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent);
            font-weight: 600;
            margin: 28px 0 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .category-label:first-of-type {
            margin-top: 0;
        }

        .work-item {
            display: grid;
            grid-template-columns: 64px 1fr auto;
            gap: 16px 24px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            align-items: baseline;
        }
        .work-item:last-child {
            border-bottom: none;
        }

        .work-year {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.3px;
        }

        .work-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .work-title {
            font-family: var(--font-heading);
            font-weight: 500;
            font-size: 1rem;
            color: var(--text);
        }
        .work-title .en {
            font-weight: 400;
            color: var(--muted);
            font-size: 0.9rem;
            font-family: var(--font);
        }
        .work-meta {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .work-credit {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .work-link-btn a {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent);
            white-space: nowrap;
        }
        .work-link-btn a i {
            margin-left: 4px;
            transition: 0.2s;
        }
        .work-link-btn a:hover i {
            transform: translateX(3px);
        }

        /* ===== 联系 ===== */
        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }
        .contact-grid a {
            font-size: 1rem;
            color: var(--text);
            font-weight: 450;
            padding: 6px 0;
            border-bottom: 1px solid transparent;
            transition: 0.2s;
        }
        .contact-grid a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .contact-grid i {
            margin-right: 10px;
            color: var(--accent);
            width: 20px;
            text-align: center;
        }

        footer {
            padding: 28px 0 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 62px;
                left: 0;
                width: 100%;
                background: var(--bg);
                padding: 24px 30px;
                gap: 16px;
                border-bottom: 1px solid var(--border);
            }
            .nav-links.open {
                display: flex;
            }
            .hamburger {
                display: flex;
            }

            #about .container {
                grid-template-columns: 1fr;
                gap: 32px;
                text-align: center;
            }
            .photo {
                max-width: 240px;
                margin: 0 auto;
            }
            .about-content .divider {
                margin: 14px auto 18px;
            }

            .work-item {
                grid-template-columns: 1fr;
                gap: 2px;
                padding: 16px 0;
            }
            .work-year {
                font-size: 0.75rem;
            }
            .work-link-btn {
                margin-top: 4px;
            }

            .section {
                padding: 48px 0 40px;
            }
            .contact-grid {
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .about-content h1 {
                font-size: 1.8rem;
            }
            .work-title {
                font-size: 0.95rem;
            }
            .work-title .en {
                font-size: 0.85rem;
                display: block;
                margin-top: 2px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 导航 ===== -->
    <header class="navbar">
        <div class="container">
            <a href="#about" class="logo">谭浏洋</a>
            <nav>
                <ul class="nav-links" id="navLinks">
                    <li><a href="#about">Home</a></li>
                    <li><a href="#works">Works</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <button class="hamburger" id="hamburger" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
            </nav>
        </div>
